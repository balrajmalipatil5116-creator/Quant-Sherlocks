<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTB | Sign in</title>
<style>
  :root { --bg:#070b14; --card:rgba(18,26,44,.72); --line:rgba(255,255,255,.1); --tx:#e8eefc; --mu:#93a1c0; --ac:#4f8cff; --ac2:#8b5cf6; --bad:#ff5d73; --ok:#2ee59d; }
  @media (prefers-color-scheme: light) { :root { --bg:#eef2fb; --card:rgba(255,255,255,.8); --line:rgba(10,20,50,.12); --tx:#101a33; --mu:#5a6785; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(900px 500px at 15% 10%, rgba(79,140,255,.28), transparent 60%),
                     radial-gradient(800px 500px at 90% 90%, rgba(139,92,246,.25), transparent 60%), var(--bg);
         color: var(--tx); font: 15px/1.5 Inter, system-ui, Segoe UI, sans-serif; display: grid; place-items: center; padding: 16px; }
  .card { width: min(400px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px;
          backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: .02em; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--ac), var(--ac2)); display: grid; place-items: center; font-size: 15px; color: #fff; }
  p.sub { margin: 6px 0 18px; color: var(--mu); font-size: 13.5px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
  .tabs button { border: 0; background: transparent; color: var(--mu); padding: 8px; border-radius: 9px; font: inherit; font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: linear-gradient(135deg, var(--ac), var(--ac2)); color: #fff; }
  label { display: block; font-size: 12.5px; color: var(--mu); margin: 12px 0 5px; }
  input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(127,127,127,.08); color: var(--tx); font: inherit; outline: none; }
  input:focus { border-color: var(--ac); box-shadow: 0 0 0 3px rgba(79,140,255,.25); }
  .go { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 11px; font: inherit; font-weight: 700; color: #fff; cursor: pointer;
        background: linear-gradient(135deg, var(--ac), var(--ac2)); }
  .go:disabled { opacity: .6; cursor: wait; }
  .err { min-height: 20px; margin-top: 12px; color: var(--bad); font-size: 13px; }
  .note { margin-top: 14px; color: var(--mu); font-size: 12px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="logo">A</span> ASTB Terminal</div>
  <p class="sub" id="sub">Sign in to use the trading dashboard.</p>
  <div class="tabs" role="tablist" id="tabs">
    <button type="button" role="tab" id="t-in" aria-selected="true">Sign in</button>
    <button type="button" role="tab" id="t-up" aria-selected="false">Create account</button>
  </div>
  <form id="f" autocomplete="on">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required minlength="3" maxlength="32" autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required minlength="8">
    <div id="p2w" class="hidden">
      <label for="p2">Repeat password</label>
      <input id="p2" type="password" autocomplete="new-password" minlength="8">
    </div>
    <button class="go" id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
  </form>
  <div class="note" id="note">Paper-trading only unless the owner changed it. Everyone who signs in shares the same trading account.</div>
</main>
<script>
(function () {
  var mode = 'in', $ = function (id) { return document.getElementById(id); };
  var info = { first_user: false, signup: true };
  function setMode(m) {
    mode = m;
    $('t-in').setAttribute('aria-selected', String(m === 'in')); $('t-up').setAttribute('aria-selected', String(m === 'up'));
    $('p2w').classList.toggle('hidden', m !== 'up');
    $('go').textContent = m === 'in' ? 'Sign in' : (info.first_user ? 'Create the owner account' : 'Create account');
    $('p').autocomplete = m === 'in' ? 'current-password' : 'new-password';
    $('err').textContent = '';
  }
  $('t-in').onclick = function () { setMode('in'); };
  $('t-up').onclick = function () { setMode('up'); };
  fetch('/api/auth/me').then(function (r) {
    if (r.ok) { location.replace('/'); return null; }
    return r.json();
  }).then(function (d) {
    if (!d) return;
    info = d;
    if (!d.signup) $('t-up').classList.add('hidden');
    if (d.first_user) { $('sub').textContent = 'First time here: create the owner account.'; setMode('up'); }
  }).catch(function () {});
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = $('u').value.trim(), p = $('p').value;
    if (mode === 'up' && p !== $('p2').value) { $('err').textContent = 'The two passwords do not match.'; return; }
    $('go').disabled = true; $('err').textContent = '';
    fetch('/api/auth/' + (mode === 'in' ? 'login' : 'signup'), {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-ASTB-Client': '1' },
      body: JSON.stringify({ username: u, password: p })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (x.ok) { location.replace('/'); return; }
        $('err').textContent = typeof x.d.detail === 'string' ? x.d.detail : 'Something went wrong.';
        $('go').disabled = false;
      }).catch(function () { $('err').textContent = 'Cannot reach the server.'; $('go').disabled = false; });
  });
})();
</script>
</body>
</html>
